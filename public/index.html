<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG DEMO</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab is-active" type="button" role="tab" data-tab="search" aria-selected="true">
          Search
        </button>
        <button class="tab" type="button" role="tab" data-tab="eval" aria-selected="false">
          Eval
        </button>
        <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false">
          Settings
        </button>
      </nav>

      <section class="panel is-active" id="panel-search" role="tabpanel" aria-labelledby="tab-search">
        <h1 class="page-title">RAG DEMO</h1>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="field-label" for="question">Type your question</label>
          <div class="input-wrap">
            <input
              id="question"
              name="question"
              type="text"
              placeholder="e.g. What does ERR-B04 mean?"
              aria-describedby="search-hint"
            />
            <button type="button" class="clear-input" id="clear-input" aria-label="Clear question" hidden>
              &times;
            </button>
          </div>
          <button type="submit" class="submit" id="submit-btn">Submit your question</button>
        </form>

        <div class="answer" id="answer">
          <h2 class="answer-title">Your answer</h2>
          <div class="answer-body" id="answer-body"></div>
        </div>
      </section>

      <section class="panel" id="panel-eval" role="tabpanel" hidden>
        <h1 class="page-title">Eval</h1>

        <div class="eval-toolbar">
          <button type="button" class="submit" id="eval-run">Run evaluation</button>
          <label class="eval-topk" for="eval-topk">
            top-k
            <input id="eval-topk" type="number" min="1" max="20" value="5" />
          </label>
        </div>

        <div class="answer eval-results" id="eval-results">
          <h2 class="answer-title">Results</h2>
          <div class="answer-body" id="eval-results-body">
            <p class="state">Not run yet.</p>
          </div>
        </div>

        <h2 class="section-title">Eval set queries</h2>
        <div class="eval-queries" id="eval-queries">
          <p class="state">Loading…</p>
        </div>
      </section>

      <section class="panel" id="panel-settings" role="tabpanel" hidden>
        <h1 class="page-title">Settings</h1>
        <p class="muted">Coming soon.</p>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
